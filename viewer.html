<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 只在 sandbox（不透明來源）的 iframe 裡使用：讀不到 App 的儲存與 token。
     連線與外部圖片一律禁止（零外部資源）；線上地圖圖磚這類資源不顯示。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; frame-src 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>HTML 檢視</title>
<script src="viewer.js"></script>
</head>
<body></body>
</html>
